    <path d="M50 48 C44 58 32 62 26 52 C20 42 24 30 36 24 C48 18 64 20 72 32 C80 44 78 62 66 72 C54 82 34 80 24 70" fill="none" stroke-width="5" stroke-linecap="round"/>
    <!-- 龙爪 -->
    <path d="M28 32 L20 28 M30 36 L18 36 M32 40 L22 46" stroke-width="2" stroke-linecap="round"/>
    <path d="M68 64 L76 70 M66 68 L74 76 M62 70 L66 80" stroke-width="2" stroke-linecap="round"/>
    <!-- 火焰宝珠 -->
